    }
    var fb = root.querySelector('[data-act="full"]');
    fb.setAttribute('aria-label', on ? 'Свернуть карту' : 'Развернуть карту');
    k = 0; measure(); edges();
    if (on) { showHint(isTouch ? 'Двигай пальцем, разводи двумя — приближай' : 'Тяни мышкой, колесо — приблизить'); }
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && root.classList.contains('is-full')) { toggleFull(); }
  });

  /* Подсказки */
  var hintT = 0, toastT = 0;
  function showHint(t) {
    hint.textContent = t; hint.classList.add('is-on');
    clearTimeout(hintT); hintT = setTimeout(function () { hint.classList.remove('is-on'); }, 2200);
  }
  function showToast(t) {
    toast.textContent = t; toast.classList.add('is-on');
    clearTimeout(toastT); toastT = setTimeout(function () { toast.classList.remove('is-on'); }, 2600);
  }

  /* Нажатие на день */
  function onPin(it, state) {
    var cx = it[1] / 100 * W, cy = it[2] / 100 * H;
    if (state === 'locked' || state === 'melted') {
      flyTo(Math.max(k, minK * 1.8), cx, cy, 600);
      dayPop(it[0], state);
      return;
    }
    flyTo(Math.max(k, minK * 2.4), cx, cy, 800, function () { openDay(it[0]); });
  }
  function openDay(n) {
    if (typeof window.advOpenDay === 'function') { window.advOpenDay(n); return; }
    showToast('День ' + n + ': здесь откроется поп-ап с подарком');
  }

  /* Кнопка «Открыть подарок дня» с главного экрана (#advent-map) */
  function goToday() {
    var d = todayNum();
    if (1 > d) {
      flyTo(minK, W / 2, H / 2, 500);
      showToast('Календарь откроется 1 декабря в 12:00 по Москве. Осталось ' + left(openAt(1) - clock.now()));
      return;
    }
    if (d > 31) { flyTo(minK, W / 2, H / 2, 500); dayPop(0, 'melted'); return; }
    onPin(DAYS[d - 1], 'today');
  }
  function left(ms) {
    var m = Math.max(0, Math.ceil(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24;
    return d ? d + ' дн ' + h + ' ч' : (h ? h + ' ч ' + (m % 60) + ' мин' : (m % 60) + ' мин');
  }

  /* ===== Мини-окно закрытого дня: «Откроется N декабря» / «Подарок растаял» ===== */
  var dp = document.createElement('div');
  dp.className = 'adv-dp';
  dp.setAttribute('role', 'dialog');
  dp.setAttribute('aria-modal', 'true');
  dp.setAttribute('aria-hidden', 'true');
  dp.innerHTML = '<div class="adv-dp__bg"></div><div class="adv-dp__box">' +
    '<button class="adv-dp__x" type="button" aria-label="Закрыть"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>' +
    '<span class="adv-dp__snow" aria-hidden="true"></span>' +
    '<div class="adv-dp__ico" aria-hidden="true"></div>' +
    '<p class="adv-dp__day"></p><h3 class="adv-dp__title"></h3><p class="adv-dp__text"></p>' +
    '<div class="adv-dp__timer" aria-hidden="true"><div><b>0</b><span>дн</span></div><div><b>00</b><span>ч</span></div><div><b>00</b><span>мин</span></div><div><b>00</b><span>сек</span></div></div>' +
    '<a class="adv-dp__btn adv-dp__btn--tg" href="' + TG_URL + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="11" height="11" fill="#fff" aria-hidden="true"><path d="M21.4 3.6 2.9 10.7c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5Z"/></svg>Перейти в TG-канал</a>' +
    '<button class="adv-dp__btn adv-dp__btn--today" type="button"><img src="https://dashkoy1.github.io/advent-calendar/assets/img/gift.svg" alt="">К подарку дня</button>' +
    '</div>';
  document.body.appendChild(dp);
  var ICO_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="#f6e4d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var ICO_SNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="#3b507d" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5l-15.6 11M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5"/></svg>';
  var dpEl = function (s) { return dp.querySelector(s); };
  var dpTimer = 0, dpDay = 0, dpCloseT = 0, dpFocus = null;
  function pad2(v) { return (v > 9 ? '' : '0') + v; }
  function dpTick() {
    var ms = openAt(dpDay) - clock.now();
    if (0 >= ms) { /* день открылся, пока окно было открыто */
      dpClose(); paintPins(); onPin(DAYS[dpDay - 1], dayState(dpDay)); return;
    }
    var s = Math.floor(ms / 1000), b = dp.querySelectorAll('.adv-dp__timer b');
    b[0].textContent = Math.floor(s / 86400); b[1].textContent = pad2(Math.floor(s / 3600) % 24);
    b[2].textContent = pad2(Math.floor(s / 60) % 60); b[3].textContent = pad2(s % 60);
  }
  function dayPop(n, state) {
    clearTimeout(dpCloseT); clearInterval(dpTimer);
    dpDay = n; dpFocus = document.activeElement;
    var melted = state === 'melted';
    dp.classList.toggle('is-melted', melted);
    dp.classList.toggle('is-locked', !melted);
    dpEl('.adv-dp__ico').innerHTML = melted ? ICO_SNOW : ICO_LOCK;
    dpEl('.adv-dp__day').textContent = n ? 'День ' + n : 'Адвент завершён';
    dpEl('.adv-dp__title').innerHTML = melted ? (n ? 'Этот подарок растаял ❄️' : 'Все подарки растаяли ❄️') : 'Откроется ' + n + ' ' + MONTHS + '<br>в 12:00';
    dpEl('.adv-dp__text').textContent = melted
      ? 'Каждый подарок живёт 48 часов. Чтобы не пропускать следующие, подпишитесь на наш TG-канал: там напоминаем о новых днях'
      : 'Подарок появится в полдень по Москве и будет доступен 48 часов';
    var td = todayNum();
    dpEl('.adv-dp__btn--today').hidden = !(td >= 1 && 31 >= td && dayState(td) !== 'melted');
    dpEl('.adv-dp__btn--tg').hidden = !melted;
    if (!melted) { dpTick(); dpTimer = setInterval(dpTick, 1000); }
    dp.classList.add('is-open');
    dp.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () { requestAnimationFrame(function () { dp.classList.add('is-on'); }); });
    setTimeout(function () { dpEl('.adv-dp__x').focus({ preventScroll: true }); }, 60);
  }
  function dpClose() {
    clearInterval(dpTimer);
    dp.classList.remove('is-on');
    dp.setAttribute('aria-hidden', 'true');
    dpCloseT = setTimeout(function () {
      dp.classList.remove('is-open');
      if (dpFocus && dpFocus.focus) { dpFocus.focus({ preventScroll: true }); }
    }, 350);
  }
  dpEl('.adv-dp__x').addEventListener('click', dpClose);
  dpEl('.adv-dp__bg').addEventListener('click', dpClose);
  dpEl('.adv-dp__btn--today').addEventListener('click', function () { dpClose(); setTimeout(goToday, 200); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && dp.classList.contains('is-open')) { e.stopImmediatePropagation(); dpClose(); }
  }, true);
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href="#advent-map"], a[href$="#advent-map"]');
    if (!a) { return; }
    e.preventDefault();
    var r = root.getBoundingClientRect();
    window.scrollTo({ top: window.pageYOffset + r.top - 20, behavior: 'smooth' });
    e.stopPropagation();
    setTimeout(goToday, 700);
  }, true);

  /* Кнопки и подсказки держим у видимого края, если блок выше окна */
  var edgeRaf = 0;
  function edges() {
    if (edgeRaf) { return; }
    edgeRaf = requestAnimationFrame(function () {
      edgeRaf = 0;
      if (root.classList.contains('is-full')) { root.style.setProperty('--vt', '0px'); root.style.setProperty('--vb', '0px'); return; }
      var r = root.getBoundingClientRect();
      var wh = window.innerHeight || vh;
      var vt = Math.max(0, Math.min(vh - 120, -r.top));
      var vb = Math.max(0, Math.min(vh - 120, r.bottom - wh));
      root.style.setProperty('--vt', vt.toFixed(0) + 'px');
      root.style.setProperty('--vb', vb.toFixed(0) + 'px');
    });
  }
  window.addEventListener('scroll', edges, { passive: true });
  window.addEventListener('resize', edges);

  /* Старт */
  measure();
  edges();
  startLoop();
  window.addEventListener('resize', measure);
  if ('ResizeObserver' in window) { new ResizeObserver(measure).observe(root); }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      if (en[0].isIntersecting) { showHint(isTouch ? 'Разведи двумя пальцами, чтобы приблизить, или разверни карту' : 'Нажми «+» или дважды кликни, чтобы приблизить'); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(root);
  }
})();
</script>
