<style>
  /* ===== Блок «Сделали с нейросетями»: снег и парение названий (HTML-элемент в Zero Block) ===== */
  .t396__elem:has(#adv-ai-fx) { pointer-events: none !important; z-index: 60 !important; }
  .t396__elem:has(#adv-ai-fx), .t396__elem:has(#adv-ai-fx) .tn-atom {
    left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important;
  }
  .adv-ai-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .adv-ai-fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* лёгкое «парение» названий нейросетей: каждое в своём ритме */
  .t396__artboard:has(#adv-ai-fx) .t396__elem[data-elem-type="button"] .tn-atom {
    animation: advAiFloat var(--fd, 5s) ease-in-out var(--fl, 0s) infinite;
    will-change: transform;
  }
  @keyframes advAiFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .t396__artboard:has(#adv-ai-fx) .t396__elem[data-elem-type="button"] .tn-atom { animation: none; }
    .adv-ai-fx canvas { display: none; }
  }
  /* ===== Скринкаст на экране ноутбука (картинка laptop-tmp.webp, экран 386–1066 × 204–637 из 1446×918) ===== */
  .adv-ai-screen {
    position: absolute; z-index: 2; pointer-events: none;
    left: 26.45%; top: 21.73%; width: 47.51%; height: 48.09%; /* запасной вариант, обычно считает скрипт */
    overflow: hidden; background: #0b0c12;
    border-radius: 1% 1% .4% .4% / 1.6% 1.6% .6% .6%;
  }
  .adv-ai-screen video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 100%; display: block; /* лишнее срезаем сверху — там чёрная строка меню */
  }
  /* «чёлка» камеры поверх видео */
  .adv-ai-screen i {
    position: absolute; z-index: 1; top: 0; left: 43.33%; width: 13.25%; height: 3.2%;
    background: #07080d; border-radius: 0 0 22% 22% / 0 0 100% 100%;
  }
</style>

<div class="adv-ai-fx" id="adv-ai-fx" aria-hidden="true"><canvas></canvas></div>

<script>
(function () {
  var root = document.getElementById('adv-ai-fx');
  if (!root) { return; }
  var ab = root.closest('.t396__artboard');
  var box = ab || root;

  /* разный ритм парения у каждого названия */
  if (ab) {
    var D = [4.6, 5.3, 4.9, 5.6];
    var btns = ab.querySelectorAll('.t396__elem[data-elem-type="button"] .tn-atom');
    Array.prototype.forEach.call(btns, function (b, i) {
      b.style.setProperty('--fd', D[i % D.length] + 's');
      b.style.setProperty('--fl', (-1.3 * i) + 's');
    });
  }

  /* скринкаст в экран ноутбука.
     Видео кладём не внутрь картинки, а прямо в артборд поверх неё: на телефоне Тильда масштабирует
     элементы через zoom, и Safari внутри такого элемента видео может не показывать. */
  (function () {
    var SRC = 'https://dashkoy1.github.io/advent-calendar/assets/ai/screencast.mp4?v=2';
    var POSTER = 'https://dashkoy1.github.io/advent-calendar/assets/ai/screencast-poster.jpg?v=2';
    var scope = ab || document;
    var img = scope.querySelector('.t396__elem[data-elem-type="image"] img[src*="laptop"], .t396__elem[data-elem-type="image"] img[data-original*="laptop"]');
    if (!img) { return; }
    var lap = img.closest('.t396__elem');
    var host = lap.parentNode;
    if (host.querySelector('.adv-ai-screen')) { return; }
    var scr = document.createElement('div');
    scr.className = 'adv-ai-screen';
    scr.innerHTML = '<video muted autoplay loop playsinline webkit-playsinline disablepictureinpicture preload="none" poster="' + POSTER + '"></video><i></i>';
    host.insertBefore(scr, lap.nextSibling);   /* сразу над ноутбуком, но под карточкой профиля и снегом */

    /* экран в картинке (px исходника 1446×918), с запасом ~2px на рамку */
    var SX = 382.5, SY = 199.5, SW = 687, SH = 441.5, NW = 1446, NH = 918;
    function place() {
      var hr = host.getBoundingClientRect(), r = img.getBoundingClientRect();
      /* артборд у Тильды сам может быть масштабирован — переводим экранные px в px артборда */
      var f = host.offsetWidth ? hr.width / host.offsetWidth : 1;
      if (!f || !isFinite(f)) { f = 1; }
      var W = r.width / f, H = r.height / f;
      if (!W || !H) { return; }
      var cs = getComputedStyle(img), fit = cs.objectFit, k, ox = 0, oy = 0;
      if (fit === 'cover' || fit === 'contain') {
        k = fit === 'cover' ? Math.max(W / NW, H / NH) : Math.min(W / NW, H / NH);
        var pos = (cs.objectPosition || '50% 50%').split(' ');
        var px = parseFloat(pos[0]) / 100, py = parseFloat(pos[1] || pos[0]) / 100;
        if (isNaN(px)) { px = .5; } if (isNaN(py)) { py = .5; }
        ox = (W - NW * k) * px; oy = (H - NH * k) * py;
      } else { k = W / NW; }
      scr.style.left = ((r.left - hr.left) / f + ox + SX * k) + 'px';
      scr.style.top = ((r.top - hr.top) / f + oy + SY * k) + 'px';
      scr.style.width = (SW * k) + 'px';
      scr.style.height = (SH * k) + 'px';
      scr.style.zIndex = getComputedStyle(lap).zIndex;
    }
    place();
    if (!img.complete) { img.addEventListener('load', place); }
    window.addEventListener('resize', function () { setTimeout(place, 150); });
    window.addEventListener('orientationchange', function () { setTimeout(place, 300); });
    window.addEventListener('load', place);
    if ('ResizeObserver' in window) { new ResizeObserver(place).observe(img); }

    var v = scr.querySelector('video');
    v.muted = true; v.defaultMuted = true; v.setAttribute('muted', ''); v.playsInline = true;
    var loaded = false, want = false;
    function play() {
      var p = v.play();
      if (p && p.catch) { p.catch(function () { armGesture(); }); }
    }
    function on() {
      want = true;
      if (!loaded) { v.src = SRC; v.load(); loaded = true; }
      play();
    }
    /* если браузер запретил автозапуск (например, режим энергосбережения на iPhone) —
       запускаем при первом касании или клике на странице */
    var armed = false;
    function armGesture() {
      if (armed) { return; }
      armed = true;
      var go = function () {
        ['touchend', 'click', 'keydown'].forEach(function (t) { document.removeEventListener(t, go, true); });
        armed = false;
        if (want) { play(); }
      };
      ['touchend', 'click', 'keydown'].forEach(function (t) { document.addEventListener(t, go, true); });
    }
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) {
        if (e[0].isIntersecting) { on(); } else if (loaded) { want = false; v.pause(); }
      }, { rootMargin: '300px 0px' }).observe(scr);
    } else { on(); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden && want) { play(); } });
  })();

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }

  /* снег: как на первом экране, чуть реже */
  var cv = root.querySelector('canvas');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, flakes = [], running = false, visible = false, raf = 0, last = 0;

  function make(randomY) {
    var r = Math.random();
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -10,
      s: 0.6 + r * r * 2.2,
      v: 14 + r * 34,
      a: 0.25 + Math.random() * 0.55,
      p: Math.random() * 6.28,
      w: 0.4 + Math.random() * 0.8
    };
  }
  function resize() {
    W = box.clientWidth; H = box.clientHeight;
    if (!W || !H) { return; }
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(100, W / 14));
    flakes = [];
    while (n--) { flakes.push(make(true)); }
  }
  function tick(t) {
    if (!running) { return; }
    var dt = Math.min(0.05, (t - (last || t)) / 1000);
    last = t;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    var i = flakes.length, f;
    while (i--) {
      f = flakes[i];
      f.p += dt * f.w;
      f.y += f.v * dt;
      f.x += Math.sin(f.p) * 12 * dt;
      if (f.y > H + 10) { flakes[i] = make(false); continue; }
      ctx.globalAlpha = f.a;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.s, 0, 6.283);
      ctx.fill();
    }
    raf = requestAnimationFrame(tick);
  }
  function update() {
    var should = visible && !document.hidden;
    if (should && !running) { running = true; last = 0; raf = requestAnimationFrame(tick); }
    if (!should && running) { running = false; cancelAnimationFrame(raf); }
  }
  resize();
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(resize, 200);
  });
  window.addEventListener('load', resize);
  document.addEventListener('visibilitychange', update);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) { visible = e[0].isIntersecting; update(); }).observe(box);
  } else {
    visible = true;
  }
  update();
})();
</script>
